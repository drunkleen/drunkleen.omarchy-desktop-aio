# Drunkleen Desktop AIO widget (Ryoku-style)
# Bundled defaults. Copy to ~/.config/drunkleen.desktop-aio/config.toml
# for personal overrides that survive plugin updates.

# Where to show: "all", or one/more monitor names (comma-separated), e.g. "DP-2"
monitor = "all"

# Placement. anchor: top-left | top-center | top-right
#                     center-left | center | center-right
#                     bottom-left | bottom-center | bottom-right | free
anchor = "bottom-right"
margin_x = 56
margin_y = 56
# Used only when anchor = "free"
x = 0
y = 0

scale = 0.55
opacity = 1.0

# Components
show_weekday = true
live_preview = true
show_clock = true
show_date = true
show_weather = true
show_spectrum = true
show_media = true
show_divider = true

# Clock
clock24h = true

# Fonts ("Inter Display" + "Material Symbols Rounded" match Ryoku)
font_display = "Inter Display"
font_icon = "Material Symbols Rounded"

# Ink/accent: "" follows the current Omarchy theme; set "#rrggbb" to override
ink = ""
accent = ""

[weather]
city = "London"
refresh_seconds = 900
units = "metric"

[spectrum]
bars = 34
fps = 30
smoothing = 45
sensitivity = 1.0

[media]
max_width = 320

# Custom positions are in design pixels; order is back-to-front stacking.
# The diagonal divider uses layout.divider.x/y and the top-level show_divider option.
[layout]
order = ["divider", "weather", "weekday", "clock", "date", "media", "spectrum"]
snap = true

# Sakura preserves the existing style; Automatic is an explicit opt-in.
[ambient]
enabled = true
mode = "sakura"
density = 0.4
speed = 0.5
opacity = 0.75
size = 1.0
wind = 0.3
preview = true
